<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim | 1294 - Abdullah Bilal Demir</title>
    <!-- Bootstrap 5 CSS (Düzeltildi) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand font-monospace" href="index.html">
                <i class="fa-solid fa-utensils me-2 text-warning"></i>
                1294 - ABDULLAH BİLAL DEMİR
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Menüye Dön
            </a>
        </div>
    </nav>

    <!-- SEPET İÇERİĞİ -->
    <main class="container my-5 flex-grow-1">
        <h2 class="fw-bold mb-4"><i class="fa-solid fa-cart-flatbed me-2 text-primary"></i>Sipariş Özetiniz</h2>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Yemek</th>
                                        <th>Fiyat</th>
                                        <th>Kalori</th>
                                        <th>Hazırlanma Süresi</th>
                                        <th class="text-center">İşlem</th>
                                    </tr>
                                </thead>
                                <tbody id="sepetTablosu">
                                    <!-- Dinamik Dolacak -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3"><i class="fa-solid fa-tag text-warning me-2"></i>İndirim Kuponu</h5>
                        <div class="input-group">
                            <input type="text" id="kuponInput" class="form-control" placeholder="ABDULLAH BİLAL DEMİR">
                            <button class="btn btn-warning fw-bold text-dark" onclick="indirimYap()">Uygula</button>
                        </div>
                        <div id="kuponMesaj" class="mt-2 small"></div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">Hesap Özeti</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Ara Toplam:</span>
                            <span id="araToplam" class="fw-bold">0 TL</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-success">
                            <span>İndirim (%25):</span>
                            <span id="indirimMiktari" class="fw-bold">0 TL</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fs-5 fw-bold text-dark mb-3">
                            <span>Genel Toplam:</span>
                            <span id="genelToplam" class="text-primary">0 TL</span>
                        </div>

                        <form id="odemeFormu" onsubmit="siparisTamamla(event)">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Kampüs Kart Şifresi</label>
                                <input type="password" 
                                       class="form-control" 
                                       placeholder="****" 
                                       required 
                                       pattern="[0-9]{4}" 
                                       title="Lütfen tam 4 haneli rakam giriniz.">
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                                <i class="fa-solid fa-check-circle me-1"></i> Siparişi Onayla
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small text-muted">&copy; 2026 Web Teknolojileri Ders Projesi</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
