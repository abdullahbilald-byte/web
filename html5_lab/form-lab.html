<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Parametre Laboratuvarı | HTML5 Simülatörü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-info sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info fs-4" href="index.html">
                <i class="fa-solid fa-flask-vial"></i> HTML5<span>LAB</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">1. Tablo & Liste Lab</a>
                <a class="nav-link active fw-bold text-info" href="form-lab.html">2. Form Parametre Lab</a>
                <a class="nav-link text-warning fw-bold" href="medya-link-kanit.html">3. Medya, Metin & Denetim</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <!-- ÖĞRENCİ GÖREVİ 2: GÜNCELLENMİŞ FORM -->
        <section class="lab-kutu border-warning">
            <h4 class="text-warning"><i class="fa-solid fa-keyboard"></i> Sıra Sizde (VS Code Görevi 2): Form Parametreleri</h4>
            <form onsubmit="gorevFormuKaydet(event)" class="bg-black p-4 rounded border border-secondary">
                <fieldset>
                    <legend class="text-info fs-5">Öğrenci Parametre Uygulama Formu</legend>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="small">1. Okul Numaranız (Pattern ve Required):</label>
                            <input type="text" id="gorevKilitInput" class="form-control bg-dark text-light" required pattern="1294" value="1294" placeholder="1294">
                        </div>
                        <div class="col-md-4">
                            <label class="small">2. 20'şer Artan Sayı (step="20"):</label>
                            <input type="number" id="gorevSayiInput" class="form-control bg-dark text-light" min="0" max="100" step="20" value="20">
                        </div>
                        <div class="col-md-4">
                            <label class="small">3. Gruplu Liste (2. Optgroup Eklendi):</label>
                            <select id="gorevSelect" class="form-select bg-dark text-light">
                                <optgroup label="Ön Uç (Front-End)">
                                    <option>HTML5</option>
                                    <option>CSS3</option>
                                </optgroup>
                                <optgroup label="Arka Uç (Back-End)">
                                    <option>JavaScript</option>
                                    <option>C# / .NET</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="small">4. Ölçüm Göstergesi (meter value="85"):</label>
                            <meter id="gorevMeter" min="0" low="40" high="80" optimum="90" max="100" value="85" class="w-100" style="height:22px;"></meter>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <button type="submit" class="btn btn-warning fw-bold text-dark w-100">Görevi Kaydet ve Test Et</button>
                        </div>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
