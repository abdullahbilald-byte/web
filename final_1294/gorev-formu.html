<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt ve Konfigüratör Formu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning fs-3" href="index.html">
                <i class="fa-solid fa-code"></i> FİNAL PORTALI
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="index.html">Vitrin</a>
                <a class="nav-link active" href="gorev-formu.html">Kayıt Formu</a>
                <a class="btn btn-warning btn-sm fw-bold text-dark ms-3" href="kanit-paneli.html">
                    Kanıt Paneli (<span id="kayitSayaci">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 850px;">
        <h2 class="text-warning text-center mb-4">Kişiselleştirilmiş Başvuru ve Konfigüratör Formu</h2>

        <form id="finalFormu" onsubmit="formuKaydet(event)" autocomplete="on">
            
            <!-- 1. FIELDSET -->
            <fieldset class="form-cerceve mb-4">
                <legend>1. Kimlik ve Kişisel Güvenlik Kilidi</legend>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Adınız ve Soyadınız (*):</label>
                        <!-- 🛠️ GÖREV 5.A: Sayfa açılınca imlecin otomatik buraya gelmesi (autofocus) ve boş geçilememesi (required) parametrelerini ekleyin -->
                        <input type="text" id="kisiAd" class="form-control ozel-input" placeholder="Abdullah Bilal Demir" autofocus required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-warning fw-bold">Kişisel Öğrenci Kilidi (Pattern Tuzağı *):</label>
                        <!-- 🛠️ GÖREV 5.B (ÇOK ÖNEMLİ): Aşağıdaki pattern="0000" kuralını öyle bir değiştirin ki; 
                             BAŞINDA SADECE SİZİN KENDİ OKUL NUMARANIZ, hemen yanına da 2 BÜYÜK HARF girildiğinde kabul etsin! 
                             (Örn: Okul numaranız 452 ise pattern="452[A-Z]{2}" yapın; böylece 452TR yazınca açılır!) -->
                        <input type="text" id="ozelKilitKodu" class="form-control ozel-input" required pattern="1294[A-Z]{2}" title="Okul Numaranız + 2 Büyük Harf giriniz (Örn: 1294TR)" placeholder="Örn: 1294TR">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Şehir / Bölge Seçimi (Datalist *):</label>
                        <input list="benimSehirlerim" id="sehirInput" class="form-control ozel-input" required placeholder="Şehir seçin veya yazın...">
                        <!-- 🛠️ GÖREV 5.C: Datalist içinde şu an sadece 2 şehir var. İçine kendi memleketiniz dahil EN AZ 4 YENİ SEÇENEK daha ekleyin! -->
                        <datalist id="benimSehirlerim">
                            <option value="Zonguldak">
                            <option value="Ankara">
                            <option value="İstanbul">
                            <option value="İzmir">
                            <option value="Bursa">
                            </option>    
                        </datalist>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tarih Seçimi (*):</label>
                        <!-- 🛠️ GÖREV 5.D: type="text" olarak bırakılmış! Bunu gerçek bir TARİH (date) seçiciye dönüştürün! -->
                        <input type="date" id="tarihInput" class="form-control ozel-input" required>
                    </div>
                </div>
            </fieldset>

            <!-- 2. FIELDSET -->
            <fieldset class="form-cerceve mb-4">
                <legend>2. Konsept Seçenekleri ve Ölçüm Parametreleri</legend>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Hizmet / Paket Kategorisi (Optgroup *):</label>
                        <!-- 🛠️ GÖREV 6.A: Aşağıdaki <select> içinde sadece 1 tane <optgroup> var. 
                             Altına kendi konseptinize uygun İKİNCİ BİR <optgroup> açın ve içine en az 3 <option> ekleyin! -->
                        <select id="kategoriInput" class="form-select ozel-input" required>
                            <option value="">-- Seçim Yapınız --</option>
                            <optgroup label="Özel E-Spor / VIP Paketler">
                                <option value="Pro Antrenman">Pro Antrenman</option>
                                <option value="Elite Turnuva">Elite Turnuva</option>
                                <option value="Sınırsız Koçluk">Sınırsız Koçluk</option>
                            </optgroup>
                            <!-- 2. OPTGROUP BURAYA EKLENECEK -->
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Miktar / Seviye (Number - Min/Max/Step Tuzağı):</label>
                        <!-- 🛠️ GÖREV 6.B: Bu kutunun en az 10 (min), en fazla 100 (max) almasını ve 10'ar 10'ar (step="10") artmasını sağlayın! -->
                        <input type="number" id="miktarInput" class="form-control ozel-input" min="10" max="100" step="10" value="10" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label d-flex justify-content-between">
                            <span>Güç / Bütçe Kaydırıcısı (Range):</span>
                            <strong id="rangeGosterge" class="text-warning">50</strong>
                        </label>
                        <input type="range" id="gucRange" class="form-range mt-2" min="10" max="100" step="5" value="50" oninput="rangeYazdir(this.value)">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Kart Özel Tema Rengi (Color):</label>
                        <!-- 🛠️ GÖREV 6.C: type="text" olarak bırakılmış! Bunu gerçek bir RENK SEÇİCİYE (color) dönüştürün! -->
                        <input type="color" id="renkInput" class="form-control form-control-color w-100 ozel-input" value="#ffc107">
                    </div>

                    <!-- 🛠️ GÖREV 6.D (KENDİ ELEMANINI EKLE): Aşağıdaki boş div'in içine kendi konseptinize uygun 
                         en az 2 adet Radio veya Checkbox seçeneği (veya Textarea) kodlayın! -->
                    <!-- 🛠️ GÖREV 6.D ÇÖZÜMÜ: Ekstra Checkbox ve Tercih Alanı -->
                    <div class="col-12 p-3 border border-secondary rounded bg-black">
                        <label class="form-label text-info fw-bold">Ekstra Donanım ve Hizmet Tercihleri:</label>
                        
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="ekstraDonanim1" value="Özel RGB Ekipman">
                            <label class="form-check-label text-light" for="ekstraDonanim1">
                                Profesyonel RGB Oyuncu Ekipmanları Dahil Edilsin
                            </label>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="ekstraDonanim2" value="7/24 Teknik Destek">
                            <label class="form-check-label text-light" for="ekstraDonanim2">
                                7/24 Kesintisiz Teknik Destek ve Koçluk İstiyorum
                            </label>
                        </div>

                        <textarea id="ekstraNot" rows="2" class="form-control ozel-input" placeholder="Konseptinize özel ek not veya talebiniz..."></textarea>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark flex-grow-1">
                    <i class="fa-solid fa-floppy-disk"></i> KAYDET VE KANIT PANELİNE GİT
                </button>
                <button type="reset" class="btn btn-outline-danger btn-lg">Sıfırla</button>
            </div>
        </form>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
