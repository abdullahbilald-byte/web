<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Teknoloji Mağazası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. ÜST MENÜ VE CANLI SEPET SAYACI -->
    <header>
        <h1 class="logo">⚡ Tech<span>Store</span></h1>
        <nav>
            <a href="index.html" class="aktif">Mağaza Vitrini</a>
            <!-- Sepetteki ürün sayısı JS ile buradaki <span> içine yazılacak -->
            <a href="sepet.html" class="sepet-buton">🛒 Sepetim (<span id="sepetSayaci">0</span>)</a>
        </nav>
    </header>

    <!-- 2. KATEGORİ FİLTRE BUTONLARI (GÖREV 2: Saatler ve Güneş Gözlükleri eklendi) -->
    <section class="kategori-bar">
        <button onclick="urunleriGetir('laptops')" class="kat-btn">💻 Laptoplar</button>
        <button onclick="urunleriGetir('smartphones')" class="kat-btn">📱 Akıllı Telefonlar</button>
        <button onclick="urunleriGetir('tablets')" class="kat-btn">📟 Tabletler</button>
        <button onclick="urunleriGetir('mobile-accessories')" class="kat-btn">🎧 Aksesuarlar</button>
        <button onclick="urunleriGetir('mens-watches')" class="kat-btn">⌚ Saatler</button>
        <button onclick="urunleriGetir('sunglasses')" class="kat-btn">🕶️ Güneş Gözlükleri</button>
    </section>

    <!-- 3. API'DEN GELECEK ÜRÜNLERİN DİZİLECEĞİ IZGARALAR -->
    <main id="urun-vitrini" class="urun-grid">
        <h2 style="text-align:center; width:100%;">Ürünler Yükleniyor...</h2>
    </main>

    <!-- Sepete ekleme sesi için gizli audio etiketi (HTML5 Medya) -->
    <audio id="sepetSesi" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
