<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Salonu</title>
    
    <!-- YENİ BİLGİ: Google Fonts'tan "Press Start 2P" adındaki piksel yazı tipini sitemize çekiyoruz! -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="logo">ARCADE SALONU</h1>
        <p class="slogan">Geçmişe Dönüş Başlıyor. Jeton Atın!</p>
    </header>

    <main>
        <section class="oyun-kutuphanesi">
            
            <article class="oyun-karti">
                <img src="gorseller/pacman.jpg" alt="Pac-Man Oyunu">
                <div class="oyun-bilgi">
                    <h3>Pac-Man</h3>
                    <p>Yıl: 1980 | Tür: Labirent</p>
                    <a href="pacman.html" class="btn-oyna">OYNA</a>
                </div>
            </article>

            <article class="oyun-karti">
                <img src="gorseller/tetris.jpg" alt="Tetris Oyunu">
                <div class="oyun-bilgi">
                    <h3>Tetris</h3>
                    <p>Yıl: 1984 | Tür: Bulmaca</p>
                    <a href="tetris.html" class="btn-oyun">OYNA</a>
                </div>
            </article>

            <article class="oyun-karti">
                <img src="gorseller/mario.jpg" alt="Super Mario">
                <div class="oyun-bilgi">
                    <h3>Super Mario</h3>
                    <p>Yıl: 1985 | Tür: Platform</p>
                    <a href="mario.html" class="btn-oyun">OYNA</a>
                </div>
            </article>

            <article class="oyun-karti">
                <img src="gorseller/space.jpg" alt="Space Invaders">
                <div class="oyun-bilgi">
                    <h3>Space Invaders</h3>
                    <p>Yıl: 1978 | Tür: Nişancı</p>
                    <a href="space.html" class="btn-oyna">OYNA</a>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 1980 - 2026 Tüm Jeton Hakları Saklıdır.</p>
    </footer>

</body>
</html>
