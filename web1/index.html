<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Portalı - Ana Menü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            border: 2px solid #e0e0e0;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            border-color: #008CBA;
        }
        .game-info {
            text-align: left;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        .game-desc {
            font-size: 0.9rem;
            color: #666;
        }
        .btn {
            background-color: #008CBA;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .game-card:hover .btn {
            background-color: #005f73;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Oyun Portalına Hoş Geldiniz</h1>
        <p class="subtitle">Oynamak istediğiniz oyunu seçin</p>

        <div class="game-grid">
            <a href="oyun1.html" class="game-card">
                <div class="game-info">
                    <div class="game-title">✊ Taş - Kağıt - Makas</div>
                    <div class="game-desc">Bilgisayara karşı klasik strateji oyunu.</div>
                </div>
                <span class="btn">Oyna</span>
            </a>

            <a href="oyun2.html" class="game-card">
                <div class="game-info">
                    <div class="game-title">🎯 Sayı Tahmin Oyunu</div>
                    <div class="game-desc">1-100 arasındaki gizli sayıyı en az denemede bul.</div>
                </div>
                <span class="btn">Oyna</span>
            </a>

            <a href="oyun3.html" class="game-card">
                <div class="game-info">
                    <div class="game-title">🧩 Hafıza & Renk Eşleştirme</div>
                    <div class="game-desc">Kartları çevirerek simgelerin eşlerini eşleştir.</div>
                </div>
                <span class="btn">Oyna</span>
            </a>
        </div>
    </div>

</body>
</html>
