<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uçuş Rezervasyon Formu | AeroSiber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-info">
        <div class="container">
            <a class="navbar-brand fw-bold text-info fs-3" href="index.html">
                <i class="fa-solid fa-plane-departure"></i> AERO<span class="text-white">SİBER</span>
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfa</a>
                <a class="nav-link active" href="rezervasyon.html">Bilet Rezervasyon</a>
                <a class="btn btn-info btn-sm fw-bold text-dark ms-3" href="biletlerim.html">
                    Biniş Kartlarım (<span id="biletSayaci">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 900px;">
        <h2 class="text-info text-center mb-4"><i class="fa-solid fa-ticket-simple"></i> Akıllı Uçuş ve Biniş Kartı Formu</h2>

        <form id="ucusFormu" onsubmit="biletOlustur(event)" method="post" autocomplete="on">
            
            <input type="hidden" id="terminalKodu" value="TR-ZNG-TERMINAL-1">

            <!-- 1. BÖLÜM: KİMLİK -->
            <fieldset class="ozel-fieldset mb-4">
                <legend><i class="fa-solid fa-user-check"></i> 1. Yolcu Kimlik ve Güvenlik Bilgileri</legend>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Yolcu Adı Soyadı (*):</label>
                        <input type="text" id="yolcuAd" class="form-control siber-input" required autofocus tabindex="1" placeholder="Örn: Ahmet Yılmaz">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">T.C. Kimlik / Pasaport No (*):</label>
                        <input type="text" id="tcNo" class="form-control siber-input" required pattern="[0-9]{11}" maxlength="11" tabindex="2" title="11 haneli T.C. Kimlik numaranızı giriniz" placeholder="11 Haneli Rakam">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">PNR Güvenlik Şifresi (*):</label>
                        <input type="password" id="pnrSifre" class="form-control siber-input" required pattern="[A-Za-z0-9]{4,8}" tabindex="3" title="4 ile 8 karakter arası harf veya rakam giriniz" placeholder="Örn: A1B2">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">E-Posta Adresi (*):</label>
                        <input type="email" id="yolcuMail" class="form-control siber-input" required placeholder="yolcu@mail.com">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Cep Telefonu (*):</label>
                        <input type="tel" id="yolcuTel" class="form-control siber-input" required pattern="5[0-9]{9}" placeholder="5321234567">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sosyal Medya / Web URL:</label>
                        <input type="url" id="yolcuUrl" class="form-control siber-input" placeholder="https://...">
                    </div>
                </div>
            </fieldset>

            <!-- 2. BÖLÜM: ROTA VE ZAMAN -->
            <fieldset class="ozel-fieldset mb-4">
                <legend><i class="fa-solid fa-map-location-dot"></i> 2. Uçuş Rotası ve Zamanlama</legend>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Kalkış Havalimanı (Datalist *):</label>
                        <input list="havalimanlari" id="kalkisYeri" class="form-control siber-input" required placeholder="Şehir veya kod yazın...">
                        <datalist id="havalimanlari">
                            <option value="Zonguldak Çaycuma (ONQ)">
                            <option value="İstanbul Havalimanı (IST)">
                            <option value="Ankara Esenboğa (ESB)">
                            <option value="İzmir Adnan Menderes (ADB)">
                            <option value="Antalya Havalimanı (AYT)">
                            <option value="Trabzon Havalimanı (TZX)">
                        </datalist>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Varış Noktası (Optgroup *):</label>
                        <select id="varisYeri" class="form-select siber-input" required>
                            <option value="">-- Varış Şehri Seçiniz --</option>
                            <optgroup label="Yurt İçi Uçuşlar">
                                <option value="İstanbul (IST)">İstanbul (IST)</option>
                                <option value="Ankara (ESB)">Ankara (ESB)</option>
                                <option value="İzmir (ADB)">İzmir (ADB)</option>
                            </optgroup>
                            <optgroup label="Avrupa Uçuşları">
                                <option value="Londra (LHR)">Londra (LHR)</option>
                                <option value="Berlin (BER)">Berlin (BER)</option>
                                <option value="Roma (FCO)">Roma (FCO)</option>
                            </optgroup>
                            <optgroup label="Asya & Amerika">
                                <option value="Tokyo (HND)">Tokyo (HND)</option>
                                <option value="New York (JFK)">New York (JFK)</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Uçuş Tarihi (Date *):</label>
                        <input type="date" id="ucusTarihi" class="form-control siber-input" min="2026-01-01" max="2027-12-31" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tercih Edilen Saat (Time *):</label>
                        <input type="time" id="ucusSaati" class="form-control siber-input" value="14:30" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Mil Kart Son Kullanma (Month):</label>
                        <input type="month" id="kartAy" class="form-control siber-input" value="2027-08">
                    </div>
                </div>
            </fieldset>

            <!-- 3. BÖLÜM: ÖZELLEŞTİRME -->
            <fieldset class="ozel-fieldset mb-4">
                <legend><i class="fa-solid fa-sliders"></i> 3. Kabin, Bagaj ve Kart Özelleştirme</legend>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Bagaj Ağırlığı (15-50 Kg, 5'er Artış):</label>
                        <input type="number" id="bagajKg" class="form-control siber-input" min="15" max="50" step="5" value="20" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label d-flex justify-content-between">
                            <span>Koltuk Sıra No:</span>
                            <strong id="koltukGosterge" class="text-warning">12A</strong>
                        </label>
                        <input type="range" id="koltukRange" class="form-range mt-2" min="1" max="30" step="1" value="12" oninput="koltukGuncelle(this.value)">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Biniş Kartı Tema Rengi:</label>
                        <input type="color" id="kartRengi" class="form-control form-control-color w-100 siber-input" value="#0dcaf0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Uçak İçi Özel Menü Arama (Search):</label>
                        <input type="search" id="yemekArama" class="form-control siber-input" placeholder="Örn: Vegan, Glutensiz, Çocuk Menüsü...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Öğrenci / İndirim Belgesi Yükle (File):</label>
                        <input type="file" id="belgeDosya" class="form-control siber-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Uçuş Sınıfı (Radio):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinifSecim" id="ekonomi" value="Ekonomi (2.500 TL)" checked>
                            <label class="form-check-label" for="ekonomi">Ekonomi</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sinifSecim" id="business" value="Business VIP (6.000 TL)">
                            <label class="form-check-label text-warning fw-bold" for="business">Business VIP</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Ekstra Hizmetler (Checkbox):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="ekstra1" value="Hızlı Geçiş" checked>
                            <label class="form-check-label" for="ekstra1">Fast-Track</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="ekstra2" value="Uçak İçi Wi-Fi">
                            <label class="form-check-label" for="ekstra2">Sınırsız Wi-Fi</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Kabin Ekibine Özel Notunuz (Textarea):</label>
                        <textarea id="ozelNot" rows="2" class="form-control siber-input" placeholder="Refakatçi talebi veya sağlık notu..."></textarea>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-info btn-lg fw-bold text-dark flex-grow-1">
                    <i class="fa-solid fa-print"></i> BİNİŞ KARTIMI OLUŞTUR
                </button>
                <button type="reset" class="btn btn-outline-warning btn-lg">
                    <i class="fa-solid fa-eraser"></i> Sıfırla
                </button>
            </div>
        </form>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
